name: Canonical content equivalence

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  equivalence:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          path: site

      - name: Build Nift main
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/nift-dev/nift.git nift
          make -C nift -j2

      - name: Build the website + stage canonical static copies
        working-directory: site
        run: |
          set -euo pipefail
          "$GITHUB_WORKSPACE/nift/nift" build --all >/dev/null
          cp HANDOVER.md public/HANDOVER.md
          cp MIGRATION.md public/MIGRATION.md

      - name: Verify canonical HANDOVER + MIGRATION display equivalence
        working-directory: site
        run: |
          set -euo pipefail
          python3 scripts/check_canonical_display.py HANDOVER
          python3 scripts/check_canonical_display.py MIGRATION
          python3 scripts/check_canonical_display.py --selftest