<title>Nift — $[title]</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
@if(name == "docs/existing-sites"){
<meta name="description" content="Faithfully move an existing site to Nift with parity-first migration checkpoints.">
}else if(name == "docs/rewrites"){
<meta name="description" content="Rebuild the same product and design with a new Nift implementation. Experimental rewrite workflow.">
}else if(name == "docs/redesigns"){
<meta name="description" content="Use existing requirements and content for a new Nift implementation and design. Experimental redesign workflow.">
}else{
<meta name="description" content="Nift — $[title]. Documentation, examples and guidance for the fast, dependency-aware website templating and build system.">
}
@if(name != "/"){
<link rel="canonical" href="https://nift.dev/$[name].html">
}
<meta name="theme-color" content="#02090e">
<meta name="robots" content="index,follow">
<meta name="application-name" content="Nift">
<link rel="sitemap" type="application/xml" href="/sitemap.xml">
<link rel="alternate" type="text/plain" href="/llms.txt" title="Nift agent index">
<link rel="alternate" type="text/markdown" href="/agents.md" title="Nift agent guide">
<script>
(() => {
	const mode = localStorage.getItem('nift-theme') || 'dark';
	const systemDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
	document.documentElement.dataset.themeMode = mode;
	document.documentElement.dataset.theme = mode === 'system' ? (systemDark ? 'dark' : 'light') : mode;
})();
</script>
<link rel="icon" type="image/png" href="@path('public/assets/images/favicon.png')">
<link rel="stylesheet" href="@path('public/assets/css/style.css')?v=410-workflows">
